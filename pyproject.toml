[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-watch-tray"
version = "0.1.0"
description = "KDE/Plasma tray app that asks Gemini daily about stock/security technicals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.4",
]

[project.scripts]
tech-watch = "tech_watch.app:main"

[tool.setuptools]
packages = ["tech_watch"]
